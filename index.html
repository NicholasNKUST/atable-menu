<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>煙燻林徑：歐亞野火盛宴｜A.table nordic 北歐餐桌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{--bg:#f0efec;--card:#fff;--ink:#1f2a22;--mute:#6c7468;--blue:#5b7bb3;--line:#d5d8dc;--sel:#e9eef7;--yellow:#e6e27a;--err:#b3261e;--ok:#2e6b3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c18;--card:#202821;--ink:#eceae4;--mute:#a1a99c;--blue:#8fa9d6;--line:#34403a;--sel:#27344a;--err:#ff8a80;--ok:#8fd19e}}
:root[data-theme="dark"]{--bg:#161c18;--card:#202821;--ink:#eceae4;--mute:#a1a99c;--blue:#8fa9d6;--line:#34403a;--sel:#27344a;--err:#ff8a80;--ok:#8fd19e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:#1f2a22;color:#f0efec;padding:40px 20px 36px;text-align:center;border-bottom:8px solid var(--yellow)}
header .brand{font:700 15px "Noto Serif TC",serif;letter-spacing:.3em;color:#9fb5dc;margin:0 0 14px}
h1{font:700 clamp(26px,5vw,40px)/1.25 "Noto Serif TC",serif;margin:0 0 4px}
header .en{margin:0 0 18px;color:#c8cdc2;font-size:14px}
header .intro{max-width:560px;margin:0 auto;color:#d9ddd2;font-size:15px;text-align:left}
header .price{margin-top:20px;font:700 22px "Noto Serif TC",serif}
header .price small{font:400 13px "Noto Sans TC",sans-serif;color:#c8cdc2;margin-left:6px}
main{max-width:1040px;margin:0 auto;padding:24px 16px 96px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.course{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.course.done{border-color:var(--blue)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.head h2{font:700 17px "Noto Serif TC",serif;margin:0;color:var(--blue)}
.tag{font-size:13px;color:var(--mute)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
.opt:hover,.opt.on{background:var(--sel)}
.opt input{width:20px;height:20px;margin-top:3px;accent-color:var(--blue);flex:none}
.fixed{padding:6px 2px}
.fixed::before{content:"✓ ";color:var(--blue)}
.up{font-size:12px;border:1px solid var(--blue);color:var(--blue);border-radius:99px;padding:0 8px;margin-left:6px;white-space:nowrap;font-style:normal}
.sub{font-size:13px;color:var(--mute)}
.who{display:grid;grid-template-columns:1fr 120px;gap:12px}
.who label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.who input,.who select{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
aside{position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:calc(100vh - 24px);overflow:auto}
aside h2{font:700 19px "Noto Serif TC",serif;margin:0 0 4px}
.total{font-weight:500;margin-top:4px}
.prog{height:6px;background:var(--line);border-radius:9px;margin:10px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.sum{list-style:none;margin:10px 0;padding:0}
.sum li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum b{font-weight:500;color:var(--mute);flex:none;font-size:13px}
.sum .none{color:var(--mute);font-style:italic}
.sum span{text-align:right}
.btns{display:flex;gap:8px;margin-top:8px}
button{font:inherit;font-size:15px;min-height:44px;padding:9px 14px;border-radius:8px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;flex:1}
button.ghost{background:transparent;color:var(--blue)}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#submit{width:100%;margin-top:12px;font-weight:500}
.msg{margin:10px 0 0;font-size:14px;min-height:1.4em}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.bar{display:none}
figure{max-width:1040px;margin:0 auto;padding:0 16px 48px;text-align:center}
figure img{max-width:100%;width:520px;height:auto;border-radius:8px;border:1px solid var(--line)}
figcaption{color:var(--mute);font-size:13px;margin-top:8px}
@media(max-width:800px){
main{grid-template-columns:1fr}
aside{position:static;max-height:none}
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);justify-content:space-between;align-items:center;z-index:5}
.bar a{color:var(--blue);font-weight:500}
}
</style>
</head>
<body>
<header>
  <p class="brand">A.table nordic 北歐餐桌</p>
  <h1>煙燻林徑：歐亞野火盛宴</h1>
  <p class="en">The Smoky Path: Eurasian Wildfire Feast</p>
  <p class="intro">這不僅是一場烤肉，更是一次穿越森林與海岸的感官之旅。我們取法北歐對於「原火」的崇拜，將小農時蔬與高級海產，透過鹽麴與香草進行層次堆疊。從清爽的雪橇沙拉到海陸交織的野火烤物，在 A.table 的餐桌上，感受最粗獷卻精緻的溫馨聚落氛圍。</p>
  <p class="price">每位 $1590<small>未稅｜最低 10 位出餐</small></p>
</header>

<main>
  <div>
    <section class="course" aria-label="填寫人資訊">
      <div class="head"><h2>你的資料</h2><span class="tag">必填</span></div>
      <div class="who">
        <div><label for="name">姓名</label><input id="name" maxlength="50" autocomplete="name" placeholder="請輸入姓名"></div>
        <div><label for="hc">人數</label>
          <select id="hc"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
      </div>
      <p class="sub" style="margin:8px 0 0">選擇的每道菜會依人數計算份數，例如 3 人即每道各 3 份。</p>
    </section>
    <section id="courses" aria-label="菜單"></section>
  </div>
  <aside id="summary" aria-live="polite">
    <h2>目前已選菜色</h2>
    <div class="total" id="total"></div>
    <div class="sub" id="count"></div>
    <div class="prog"><i id="bar"></i></div>
    <ul class="sum" id="list"></ul>
    <button id="submit">送出訂單</button>
    <p class="msg" id="msg" role="status"></p>
    <div class="btns">
      <button id="copy" class="ghost">複製清單</button>
      <button id="reset" class="ghost">全部清除</button>
    </div>
  </aside>
</main>

const PRICE=1590;

const MENU=[
{c:"開胃沙拉",items:["牛排沙拉","骰子雞腿排沙拉"],pick:1},
{c:"極地雪橇",items:["小農時蔬盛盤 墨西哥烤玉米"]},
{c:"北國海味",items:["生食干貝佐深海蟹膏醬"]},
{c:"經典好味",items:["安格斯無骨牛小排"]},
{c:"主廚特製",items:["鹽麴風味松阪豬"]},
{c:"暖心好鍋",items:["花蟹鍋","剝皮辣椒雞湯","明洞魚板湯"],pick:1},
{c:"大地恩賜",items:["明太子茭白筍"]},
{c:"在地風味",items:["香草豬在地蔥香捲","古早味紹興香腸"],pick:1},
{c:"鮮美海味",items:["紐西蘭冰河帝王鮭下巴","時令海魚"],pick:1,up:"時令海魚"},
{c:"鮮美海味",items:["味自慢鮑魚","鹽火藍鑽蝦"],pick:1},
{c:"主廚特製",items:["森林火烤秘製香料雞肉串","Masala辣醬櫻桃鴨腿串"],pick:1},
{c:"工藝手作",items:["黃金海鮮脆餅"],note:"基隆仁愛市場天婦羅"},
{c:"手工小堡",items:["花生豬里肌","櫻桃鴨胸"],pick:1},
{c:"暖心時光",items:["主廚甜點"]}
];
const CN=["零","一","二","三"];
const sel=MENU.map(()=>[]);
const $=id=>document.getElementById(id);
const choiceCount=MENU.filter(m=>m.pick).length;
let sending=false,sent=false;

const lab=(m,j)=>m.items[j]+(m.up===m.items[j]?"（加價升級）":"");
const hc=()=>Math.min(5,Math.max(1,parseInt($("hc").value,10)||1));

function build(){
  $("courses").innerHTML="";
  MENU.forEach((m,i)=>{
    const d=document.createElement("div");d.className="course";d.id="c"+i;
    const h=document.createElement("div");h.className="head";
    h.innerHTML=`<h2>${m.c}</h2><span class="tag">${m.pick?CN[m.items.length]+"選"+CN[m.pick]:"主廚安排"}</span>`;
    d.appendChild(h);
    if(!m.pick){
      const p=document.createElement("div");p.className="fixed";
      p.innerHTML=m.items[0]+(m.note?` <span class="sub">${m.note}</span>`:"");
      d.appendChild(p);
    }else{
      m.items.forEach((it,j)=>{
        const l=document.createElement("label");l.className="opt";
        const cb=document.createElement("input");cb.type="checkbox";
        cb.onchange=()=>toggle(i,j,cb.checked);
        const t=document.createElement("span");
        t.innerHTML=it+(m.up===it?'<em class="up">加價升級</em>':"");
        l.append(cb,t);d.appendChild(l);
      });
    }
    $("courses").appendChild(d);
  });
}
function touched(){
  if(sent){sent=false;setMsg("","");}
  render();
}
function toggle(i,j,on){
  const m=MENU[i],s=sel[i];
  if(on){s.push(j);while(s.length>m.pick)s.shift();}
  else sel[i]=s.filter(x=>x!==j);
  touched();
}
function render(){
  const n=hc();
  MENU.forEach((m,i)=>{
    if(!m.pick)return;
    const d=$("c"+i);
    d.classList.toggle("done",sel[i].length===m.pick);
    d.querySelectorAll(".opt").forEach((l,j)=>{
      const on=sel[i].includes(j);
      l.classList.toggle("on",on);l.querySelector("input").checked=on;
    });
  });
  const done=MENU.filter((m,i)=>m.pick&&sel[i].length===m.pick).length;
  $("total").textContent=`${n} 位 × $${PRICE} = $${(n*PRICE).toLocaleString()}（未稅）`;
  $("count").textContent=`選擇題 ${done} / ${choiceCount} 輪已完成`;
  $("bar").style.width=(done/choiceCount*100)+"%";
  $("barText").textContent=`已完成 ${done} / ${choiceCount} 輪選擇`;
  $("list").innerHTML=MENU.map((m,i)=>{
    let v;
    if(!m.pick)v=m.items[0]+" ×"+n;
    else if(sel[i].length)v=sel[i].map(j=>lab(m,j)+" ×"+n).join("<br>");
    else v='<span class="none">尚未選擇</span>';
    return `<li><b>${m.c}</b><span>${v}</span></li>`;
  }).join("");
  $("submit").disabled=sending||sent;
  $("submit").textContent=sending?"送出中…":sent?"已送出":"送出訂單";
}
function plain(){
  const n=hc();
  return `煙燻林徑：歐亞野火盛宴（${n} 位）\n`+MENU.map((m,i)=>{
    const v=!m.pick?m.items[0]:sel[i].length?sel[i].map(j=>lab(m,j)).join("、"):"（尚未選擇）";
    return `${m.c}｜${v} ×${n}`;}).join("\n");
}
function setMsg(t,cls){const m=$("msg");m.textContent=t;m.className="msg "+(cls||"");}

async function submit(){
  const name=$("name").value.trim();
  if(!name){setMsg("請先填寫姓名","err");$("name").focus();return;}
  const miss=MENU.map((m,i)=>m.pick&&sel[i].length!==m.pick?i:-1).filter(i=>i>=0);
  if(miss.length){
    setMsg("還有 "+miss.length+" 輪沒選："+miss.map(i=>MENU[i].c+"（"+MENU[i].items.join("／")+"）").join("；"),"err");
    $("c"+miss[0]).scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  if(ENDPOINT.indexOf("PASTE_")===0){setMsg("尚未設定送出網址，請主辦人先完成 Apps Script 設定","err");return;}
  const payload={name,headcount:hc(),
    picks:MENU.map((m,i)=>m.pick?lab(m,sel[i][0]):null).filter(x=>x!==null)};
  sending=true;setMsg("","");render();
  try{
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    sent=true;
    setMsg("已送出給主辦人。若修改後再次送出，會新增另一筆回覆。","ok");
  }catch(e){
    setMsg("送出失敗，請檢查網路後再試一次","err");
  }
  sending=false;render();
}
$("submit").onclick=submit;
$("name").oninput=touched;
$("hc").onchange=touched;
$("copy").onclick=async()=>{
  const b=$("copy");
  try{await navigator.clipboard.writeText(plain());b.textContent="已複製";}
  catch(e){b.textContent="無法複製，請手動選取";}
  setTimeout(()=>b.textContent="複製清單",1600);
};
$("reset").onclick=()=>{sel.forEach((_,i)=>sel[i]=[]);touched();};
build();render();
</script>
</body>
</html>
